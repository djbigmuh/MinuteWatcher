complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: 15
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 10
    constructorThreshold: 10

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - Error
      - RuntimeException
      - Throwable

naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '[a-z][A-Za-z0-9]*'
    excludeClassPattern: '.*Test$'
    ignoreAnnotated:
      - 'androidx.compose.runtime.Composable'
      - 'Composable'
  VariableNaming:
    active: true
    variablePattern: '[a-z][A-Za-z0-9]*'
  ClassNaming:
    active: true
    classPattern: '[A-Z][A-Za-z0-9]*'

style:
  active: true
  MaxLineLength:
    active: true
    maxLineLength: 120
  UnusedImports:
    active: true
  MagicNumber:
    active: true
    excludes: ['**/*Test.kt', '**/*Test*.kt']
    ignorePropertyDeclaration: true
    ignoreAnnotated:
      - 'androidx.compose.runtime.Composable'
      - 'Composable'
      - 'org.junit.Test'
      - 'Test'

potential-bugs:
  active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  InvalidRange:
    active: true
