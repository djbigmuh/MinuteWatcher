comments:
  active: true
  UndocumentedPublicClass:
    active: false # Disabled as KDoc is not mandatory for every public class
  UndocumentedPublicFunction:
    active: false # Disabled as KDoc is not mandatory for every public function
  UndocumentedPublicProperty:
    active: false # Disabled as KDoc is not mandatory for every public property
  DocumentationOverPrivateFunction:
    active: false # Disabled to allow inline documentation comments over private functions
  DocumentationOverPrivateProperty:
    active: false # Disabled to allow inline documentation comments over private properties
  OutdatedDocumentation:
    active: false # Disabled for optional inline doc tags in KDoc

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 15
  CognitiveComplexMethod:
    active: true
    allowedComplexity: 30
    excludes: [ '**/src/test/**', '**/src/androidTest/**', '**/src/testFixtures/**' ]
  LongMethod:
    active: true
    allowedLines: 60
    excludes: [ '**/src/test/**', '**/src/androidTest/**', '**/src/testFixtures/**' ]
    ignoreAnnotated: [ 'Composable', 'androidx.compose.runtime.Composable' ]
  LargeClass:
    active: true
    excludes: [ '**/src/test/**', '**/src/androidTest/**', '**/src/testFixtures/**', '**/core/data/TrafficTracker.kt', '**/core/data/UpdateCoordinator.kt' ]
  LongParameterList:
    active: true
    allowedFunctionParameters: 10
    allowedConstructorParameters: 10
    excludes: [ '**/src/test/**', '**/src/androidTest/**', '**/src/testFixtures/**' ]
  TooManyFunctions:
    active: false # Disabled to allow coordinator and test fixture classes without arbitrary function count limits
  ComplexInterface:
    active: false # Disabled to allow repository interfaces defining full data contracts
  StringLiteralDuplication:
    active: true
    allowedDuplications: 5
    ignoreStringsRegex: '^[A-Z][A-Z0-9_]*$'
  LabeledExpression:
    active: false # Disabled to allow labeled returns/breaks in coroutine and DataStore blocks

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
    excludes: [ '**/src/test/**', '**/src/androidTest/**', '**/src/testFixtures/**' ]
  InjectDispatcher:
    active: true
    dispatcherNames:
      - 'IO'
      - 'Default'
      - 'Main'
      - 'Unconfined'
    excludes:
      - '**/DispatchersModule.kt'
      - '**/AppLogger.kt'
      - '**/src/test/**'
      - '**/src/androidTest/**'
      - '**/src/testFixtures/**'
  SleepInsteadOfDelay:
    active: true
    excludes: [ '**/src/test/**', '**/src/androidTest/**', '**/src/testFixtures/**' ]

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
  TooGenericExceptionThrown:
    active: true
    excludes: [ '**/src/test/**', '**/src/androidTest/**', '**/src/testFixtures/**' ]

naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '[a-z][A-Za-z0-9]*'
    excludeClassPattern: '.*Test$'
    ignoreAnnotated:
      - 'androidx.compose.runtime.Composable'
      - 'Composable'
  FunctionNameMaxLength:
    active: true
    maximumFunctionNameLength: 50
    excludes: [ '**/src/test/**', '**/src/androidTest/**', '**/src/testFixtures/**' ]
  FunctionNameMinLength:
    active: true
    minimumFunctionNameLength: 3
    excludes: [ '**/core/common/util/AppLogger.kt', '**/core/common/util/Logger.kt', '**/src/test/**', '**/src/androidTest/**', '**/src/testFixtures/**' ]
  VariableNaming:
    active: true
    variablePattern: '[a-z][A-Za-z0-9]*'
  ClassNaming:
    active: true
    classPattern: '[A-Z][A-Za-z0-9]*'

style:
  active: true
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludes: [ '**/src/test/**', '**/src/androidTest/**', '**/src/testFixtures/**' ]
  UnusedImport:
    active: true
  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1', '2']
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreNamedArgument: true
    ignoreAnnotated:
      - 'androidx.compose.runtime.Composable'
      - 'Composable'
    excludes: [ '**/src/test/**', '**/src/androidTest/**', '**/src/testFixtures/**' ]
  ForbiddenMethodCall:
    active: true
    methods:
      - reason: 'print does not allow configuring the output stream. Use AppLogger instead.'
        value: 'kotlin.io.print'
      - reason: 'println does not allow configuring the output stream. Use AppLogger instead.'
        value: 'kotlin.io.println'
      - reason: 'Thread.sleep is forbidden in production code. Use delay or non-blocking synchronization instead.'
        value: 'java.lang.Thread.sleep'
    excludes: [ '**/src/test/**', '**/src/androidTest/**', '**/src/testFixtures/**' ]
  ForbiddenImport:
    active: true
    forbiddenImports:
      - 'android.*'
      - 'android.**'
    includes: [ '**/core/model/src/**', '**/core/domain/src/**' ]
  UnnecessaryParentheses:
    active: false # Disabled to allow explicit grouping parentheses for clarity in arithmetic/boolean logic
  UnderscoresInNumericLiterals:
    active: false # Disabled to allow standard numeric literals without mandatory underscores
  CascadingCallWrapping:
    active: false # Disabled to allow flexible call chain formatting matching ktlint rules
  ClassOrdering:
    active: false # Disabled to allow logical grouping of members inside classes
  BracesOnWhenStatements:
    active: false # Disabled to allow concise single-line when branch entries
  UseIfInsteadOfWhen:
    active: false # Disabled to allow when expressions for binary conditions
  CollapsibleIfStatements:
    active: false # Disabled to allow nested if statements for explicit condition separation
  DataClassContainsFunctions:
    active: false # Disabled to allow utility extension/helper methods on value data classes
  MultilineRawStringIndentation:
    active: true
    excludes: [ '**/src/test/**', '**/src/androidTest/**', '**/src/testFixtures/**' ]
  ReturnCount:
    active: true
    max: 4
    excludeGuardClauses: true
    excludes: [ '**/src/test/**', '**/src/androidTest/**', '**/src/testFixtures/**' ]
  UseLet:
    active: false # Disabled to allow explicit null checking

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
    excludes: [ '**/src/test/**', '**/src/androidTest/**', '**/src/testFixtures/**' ]
  UnnecessaryNotNullOperator:
    active: true
    excludes: [ '**/src/test/**', '**/src/androidTest/**', '**/src/testFixtures/**' ]
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  InvalidRange:
    active: true
  LateinitUsage:
    active: true
    ignoreAnnotated:
      - 'dagger.hilt.android.HiltAndroidApp'
      - 'dagger.hilt.android.AndroidEntryPoint'
