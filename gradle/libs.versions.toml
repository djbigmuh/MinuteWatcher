leakcanary = "2.14"
hiltWork = "1.4.0"
mockito = "5.24.0"
mockitoKotlin = "6.4.0"
appsearch = "1.1.0"
# AppFunctions (1.0.0): required for @AppFunctionServiceEntryPoint API and service/schema generation via KSP.
appfunctions = "1.0.0"
kotlinxCoroutines = "1.11.0"
ktlint = "14.2.0"
colorpickerCompose = "1.1.2"
# Detekt (2.0.0-alpha.6): required for Gradle 9.x compatibility and modern JDK toolchains; transition to stable 2.x release once available.
detekt = "2.0.0-alpha.6"
desugarJdkLibs = "2.1.5"
javaxInject = "1"
byteBuddyAgent = "1.17.7"

[libraries]
byteBuddyAgent = { group = "net.bytebuddy", name = "byte-buddy-agent", version.ref = "byteBuddyAgent" }
# DI - Hilt
daggerHiltAndroid = { group = "com.google.dagger", name = "hilt-android", version.ref = "hiltVersion" }
