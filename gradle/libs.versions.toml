androidxTestRunner = { group = "androidx.test", name = "runner", version.ref = "androidxTestCore" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidxJunit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }

# Compose
androidxComposeFoundation = { group = "androidx.compose.foundation", name = "foundation" }
