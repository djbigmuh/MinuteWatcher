[versions]
agp = "9.5.2"
kotlin = "2.4.21"
coreKtx = "1.19.1"
hiltVersion = "2.60.1"
lifecycle = "2.11.1"
datastore = "1.3.0"
ksp = "2.3.12"
junit = "4.13.2"
junitVersion = "1.3.0"
androidxTestCore = "1.7.0"
# Robolectric 4.18 is the stable release with Android SDK 37 support.
robolectric = "4.18"
activityCompose = "1.9.3"
