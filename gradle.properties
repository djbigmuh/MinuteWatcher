# Project-wide Gradle settings.

# Xmx8192m: Sufficient heap for heavy Robolectric tests and large DataStore graphs.
# --add-opens: Required for Mockito and Robolectric internal access on JDK 17/21+.
org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8 --add-opens=java.base/jdk.internal.access=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED

# Enabled to speed up multi-module build execution.
org.gradle.parallel=true

org.gradle.caching=true
org.gradle.daemon=true

# Disabled to prevent potential build inconsistencies in complex multi-module hierarchies.
org.gradle.configureondemand=false

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Fix for AGP 8.7+ and 9.x initialization on Windows.
# The system PATH contains trailing backslashes escaping semicolons which
# breaks AndroidLocationsBuildService.
android.overridePathCheck=true
# Show all deprecation warnings for Gradle build scripts.
org.gradle.warning.mode=all

# Enabled parallel project synchronization for faster IDE import in Gradle 9.4+.
org.gradle.tooling.parallel=true
# Configuration cache enabled for build performance.
org.gradle.configuration-cache=true
