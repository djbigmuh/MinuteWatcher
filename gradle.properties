# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 --add-opens=java.base/jdk.internal.access=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED -Xshare:off
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Force JDK 21 for all Gradle processes (including detekt, KSP, Kotlin daemon).
# This overrides any JAVA_HOME/PATH inheritance and prevents JDK 25 leakage.
org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-21.0.12.8-hotspot

# Fix for AGP 8.7+ and 9.x initialization on Windows
android.overridePathCheck=true
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# Gradle 10 compatibility
org.gradle.warning.mode=summary

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Configuration Cache (disabled due to compatibility issues with some plugins)
org.gradle.configuration-cache=false
#org.gradle.configuration-cache.problems=fail

# Force JDK 21 is handled by foojay-resolver in settings.gradle.kts
