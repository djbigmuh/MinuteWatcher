# Project-wide Gradle settings.

# Heap size (8GB) and Metaspace (2GB) for parallel Robolectric tests & DataStore graph resolution.
# UTF-8 file encoding for cross-platform string handling.
# --add-opens required for Mockito and Robolectric JDK internal reflection access on JDK 17/21+.
org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8 --add-opens=java.base/jdk.internal.access=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED

# Enables parallel execution of decoupled subprojects.
org.gradle.parallel=true

# Enables Gradle task output build caching.
org.gradle.caching=true

# Keeps Gradle daemon process alive to avoid JVM cold-start overhead.
org.gradle.daemon=true

# Disables configure-on-demand to prevent missing task/project dependencies in multi-module graphs.
org.gradle.configureondemand=false

# Enforces AndroidX support libraries.
android.useAndroidX=true

# Sets Kotlin code style formatting to official recommendations.
kotlin.code.style=official

# Enables non-transitive R classes to isolate resource references and speed up compilation.
android.nonTransitiveRClass=true

# Displays all deprecation warnings for Gradle build scripts.
org.gradle.warning.mode=all

# Enables parallel project synchronization during IDE model imports.
org.gradle.tooling.parallel=true

# Enables configuration cache to store and reuse project task graphs across builds.
org.gradle.configuration-cache=true

