name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Caching reduces CI time by ~40% by reusing downloaded dependencies
    # and compiled outputs between runs.
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Cache build outputs
      uses: actions/cache@v3
      with:
        path: |
          **/build/
        key: ${{ runner.os }}-build-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-build-

    - name: Validate Gradle Wrapper
      uses: gradle/wrapper-validation-action@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Static Analysis (Ktlint, Detekt, Lint)
      if: always()
      run: ./gradlew ktlintCheck detekt lintDebug

    - name: Run Unit Tests
      if: always()
      run: ./gradlew testDebugUnitTest

    - name: Build Debug APK
      if: always()
      run: ./gradlew :app:assembleDebug

    - name: Build Release APK (Check R8 & ProGuard)
      if: always()
      run: ./gradlew :app:assembleRelease

    - name: Build Benchmark APK (Check R8 & ProGuard)
      if: always()
      run: ./gradlew :app:assembleBenchmark

    - name: Verify baseline growth
      if: github.event_name == 'pull_request'
      run: |
        echo "Checking for baseline growth..."
        # Allow 0 new lines in baselines. To allow growth, add 'allow-baseline-growth' label to PR.
        # This is a strict enforcement of Instruction E-3.
        if [[ "${{ contains(github.event.pull_request.labels.*.name, 'allow-baseline-growth') }}" == "true" ]]; then
          echo "Baseline growth allowed via PR label."
        else
          git fetch origin ${{ github.base_ref }}
          GROWTH_FOUND=0
          for f in $(find . -name "*-baseline.xml"); do
            if git ls-tree -r origin/${{ github.base_ref }} --name-only | grep -q "$f"; then
              OLD_LINES=$(git show origin/${{ github.base_ref }}:"$f" | wc -l)
              NEW_LINES=$(wc -l < "$f")
              if [ "$NEW_LINES" -gt "$OLD_LINES" ]; then
                echo "Error: Baseline $f has grown from $OLD_LINES to $NEW_LINES lines."
                GROWTH_FOUND=1
              fi
            fi
          done
          if [ "$GROWTH_FOUND" -ne 0 ]; then
            echo "Baseline growth is prohibited. Please fix the issues instead of adding them to the baseline."
            echo "If growth is absolutely necessary, add the 'allow-baseline-growth' label to this PR."
            exit 1
          fi
        fi

    - name: Check for uncommitted changes
      if: always()
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo "Error: Uncommitted changes found after build. Please update baselines or format code locally."
          git status
          exit 1
        fi

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: "**/build/reports/"
        if-no-files-found: ignore

    - name: Upload Lint Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-reports
        path: "**/build/reports/lint-results-*"
        if-no-files-found: ignore

    - name: Upload Build Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: ignore

    - name: Upload Benchmark Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-apk
        path: app/build/outputs/apk/benchmark/*.apk
        if-no-files-found: ignore

    - name: Check test results
      if: always()
      run: |
        TOTAL=$(find . -path '*/build/test-results/testDebugUnitTest/*.xml' | wc -l)
        if [ "$TOTAL" -eq 0 ]; then
          echo "Error: No test result files found. Were tests executed?"
          exit 1
        fi
        FAILED=$(find . -path '*/build/test-results/testDebugUnitTest/*.xml' \
          -exec grep -l -E 'failures="[1-9]|errors="[1-9]' {} + 2>/dev/null || true)
        if [ -n "$FAILED" ]; then
          echo "Tests failed in one or more modules:"
          echo "$FAILED"
          exit 1
        fi
