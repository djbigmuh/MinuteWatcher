# REFERENCE-ONLY: This workflow is not used in production CI.
# Local verification is performed via VERIFY.bat.
# See docs/testing.md for details.

name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Caching reduces CI time by ~40% by reusing downloaded dependencies
    # and compiled outputs between runs.
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
            ~/.m2/repository
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Validate Gradle Wrapper
      uses: gradle/wrapper-validation-action@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Static Analysis (Ktlint, Detekt, Lint)
      run: ./gradlew ktlintCheck detekt lintDebug

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug

    - name: Build Release APK (Check R8 & ProGuard)
      run: ./gradlew :app:assembleRelease

    - name: Build Benchmark APK (Check R8 & ProGuard)
      run: ./gradlew :app:assembleBenchmark

    - name: Verify baseline growth
      if: github.event_name == 'pull_request'
      run: |
        echo "Checking for baseline growth..."
        if [[ "${{ contains(github.event.pull_request.labels.*.name, 'allow-baseline-growth') }}" == "true" ]]; then
          echo "Baseline growth allowed via PR label."
        else
          git fetch origin ${{ github.base_ref }}
          # Check for added lines ($1 > 0) or new baseline files in any *-baseline.xml
          if git diff --numstat origin/${{ github.base_ref }}...HEAD -- '*-baseline.xml' | awk '{if ($1 > 0) exit 1}'; then
            echo "Baselines are clean (no growth or new files)."
          else
            echo "Error: Baselines have grown or new baseline files were created."
            echo "Baseline growth is prohibited. Please fix the issues instead of adding them to baseline files."
            echo "If growth is absolutely necessary, add the 'allow-baseline-growth' label to this PR."
            exit 1
          fi
        fi

    - name: Check for uncommitted changes
      if: always()
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo "Error: Uncommitted changes found after build. Please update baselines or format code locally."
          git status
          exit 1
        fi

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: "**/build/reports/"
        if-no-files-found: ignore

    - name: Upload Lint Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-reports
        path: "**/build/reports/lint-results-*"
        if-no-files-found: ignore

    - name: Upload Build Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: ignore

    - name: Upload Benchmark Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-apk
        path: app/build/outputs/apk/benchmark/*.apk
        if-no-files-found: ignore

    - name: Check test results
      if: always()
      run: |
        TOTAL=$(find . -path '*/build/test-results/testDebugUnitTest/*.xml' | wc -l)
        if [ "$TOTAL" -eq 0 ]; then
          echo "Error: No test result files found. Were tests executed?"
          exit 1
        fi
        FAILED=$(find . -path '*/build/test-results/testDebugUnitTest/*.xml' \
          -exec grep -l -E 'failures="[1-9]|errors="[1-9]' {} + 2>/dev/null || true)
        if [ -n "$FAILED" ]; then
          echo "Tests failed in one or more modules:"
          echo "$FAILED"
          exit 1
        fi

  coverage:
      if: github.ref == 'refs/heads/master'
      runs-on: ubuntu-latest
      steps:
          -   uses: actions/checkout@v4
              with:
                  fetch-depth: 0
          -   name: set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: 'temurin'
          -   name: Cache Gradle packages
              uses: actions/cache@v3
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                      ~/.m2/repository
                  key: ${{ runner.os }}-gradle-coverage-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
                  restore-keys: |
                      ${{ runner.os }}-gradle-
          -   name: Grant execute permission for gradlew
              run: chmod +x gradlew
          -   name: Run Tests with Coverage
              run: ./gradlew testDebugUnitTest jacocoTestReport -Pcoverage
          -   name: Upload Coverage Reports
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-reports
                  path: "**/build/reports/jacoco/"
