name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Validate Gradle Wrapper
      uses: gradle/wrapper-validation-action@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Run Static Analysis (Ktlint, Detekt, Lint)
      run: ./gradlew ktlintCheck detekt lintRelease

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Build Release APK & Bundle
      run: ./gradlew :app:assembleRelease :app:bundleRelease

    - name: Check for uncommitted changes
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo "Error: Uncommitted changes found after build. Please update baselines or format code locally."
          git status
          exit 1
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-outputs
        path: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/bundle/release/*.aab
