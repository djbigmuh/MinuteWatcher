name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Validate Gradle Wrapper
      uses: gradle/wrapper-validation-action@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Static Analysis (Ktlint, Detekt, Lint)
      run: ./gradlew ktlintCheck detekt lintDebug

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest
      continue-on-error: true

    - name: Build Debug APK
      if: always()
      run: ./gradlew :app:assembleDebug

    - name: Build Release APK (Check R8 & ProGuard)
      if: always()
      run: ./gradlew :app:assembleRelease

    - name: Build Benchmark APK (Check R8 & ProGuard)
      if: always()
      run: ./gradlew :app:assembleBenchmark

    - name: Check for uncommitted changes
      if: always()
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo "Error: Uncommitted changes found after build. Please update baselines or format code locally."
          git status
          exit 1
        fi

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: "**/build/reports/"

    - name: Upload Lint Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-reports
        path: "**/build/reports/lint-results-*"

    - name: Upload Build Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Benchmark Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-apk
        path: app/build/outputs/apk/benchmark/*.apk

    - name: Check test results
      if: always()
      run: |
        FAILED=$(find . -path '*/build/test-results/testDebugUnitTest/*.xml' \
          -exec grep -l -E 'failures="[1-9]|errors="[1-9]' {} + 2>/dev/null || true)
        if [ -n "$FAILED" ]; then
          echo "Tests failed in one or more modules:"
          echo "$FAILED"
          exit 1
        fi
